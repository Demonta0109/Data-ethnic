version: 2

# Exposures = the things OUTSIDE dbt that use our models (dashboards, reports, ML models).
# They appear at the end of the lineage graph: impact analysis starts here.
exposures:
  - name: sales_dashboard
    label: Sales dashboard (Metabase)
    type: dashboard
    maturity: high
    owner:
      name: Sara Martin
      email: sara.martin@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Daily revenue, orders and conversion per channel. Opened every morning by the CEO."

  - name: finance_monthly_revenue_report
    label: Finance monthly revenue report
    type: analysis
    maturity: high
    owner:
      name: "CFO / Head of Finance"
    depends_on:
      - ref('fct_orders')
    description: "Monthly report of gross, refunded and net revenue used by Finance for reporting and closing."

  - name: churn_prediction_model
    label: Churn prediction model
    type: ml
    maturity: medium
    owner:
      name: "Sara Martin"
      email: sara.martin@shopfast.example
    depends_on:
      - ref('dim_customers')
    description: "Machine learning model that predicts which customers are likely to stop buying, using lifetime orders, last order date and lifetime net revenue."
