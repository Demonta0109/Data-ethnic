apiVersion: v3.2.0
kind: DataContract
id: shopfast-payments
name: ShopFast payments
version: 1.0.0
status: draft
domain: finance
dataProduct: payments

description:
  purpose: One row per payment event (captured or refunded) sent daily by the payment team to the data platform.
  usage: Revenue reporting (Finance monthly report, Sales dashboard), refunds analysis.
  limitations: Amounts are in EUROS with 2 decimals. Changing the unit, the type or the name of a field is a BREAKING change (major version).

team:
  name: payments-team
  description: Producer. Consumers are the data team (fct_orders) and Finance.
  members:
    - username: paul.girard
      role: owner
    - username: karim.benali
      role: steward

schema:
  - name: payments
    physicalName: payments
    logicalType: object
    description: Payments exported by the payment provider integration.
    properties:
      - name: payment_id
        logicalType: integer
        required: true
        unique: true
        primaryKey: true
        description: Identifier of the payment event.
      - name: order_id
        logicalType: integer
        required: true
        description: Order paid or refunded.
      - name: payment_date
        logicalType: date
        required: true
        description: Date the money moved (YYYY-MM-DD).
      # TODO 1: add the fields method, amount, currency, card_last4, status
      #         (logicalType, required, description). For card_last4: classification + tags: ['pii']
      # TODO 2: on method, currency and status: a quality rule "invalidValues ... mustBe: 0" with the allowed values
      # TODO 3: on amount: TWO sql quality rules that would have caught the cents incident
      #         (hint: type: sql, query: SELECT ... FROM payments, mustBe / mustBeBetween)
    quality:
      - metric: rowCount
        mustBeGreaterThan: 100

slaProperties:
  - property: frequency
    value: 1
    unit: d
    description: Delivered once a day before 06:00 Europe/Paris.
  - property: latency
    value: 24
    unit: h

servers:
  - server: history
    type: local
    path: ../shopfast-kit/data/payments.csv
    format: csv
  - server: batch_2
    type: local
    path: payments_batch_2.csv
    format: csv
